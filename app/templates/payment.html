{% extends "base.html" %} {% block prefetch %} {%endblock %}
{% block style %}
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
<style>
  .payment-type-selector {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
  }
  .payment-type-option {
    flex: 1;
    border: 2px solid #E9DED2;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background-color: #FFF8F0;
  }
  .payment-type-option:hover {
    border-color: #8C5A3C;
    transform: translateY(-2px);
  }
  .payment-type-option.active {
    border-color: #7FB7BE;
    background-color: rgba(127, 183, 190, 0.1);
  }
  .payment-type-option i {
    font-size: 24px;
    color: #8C5A3C;
    margin-bottom: 8px;
    display: block;
  }
  .payment-type-option.active i {
    color: #7FB7BE;
  }
  .payment-type-option span {
    font-weight: 600;
    color: #4B2E2B;
    font-size: 13px;
  }
  .border-brown {
    border-color: #E9DED2 !important;
  }
  .background-light-brown {
    background-color: #FFF8F0 !important;
  }
  .background-green {
    background-color: #7FB7BE !important;
    border-color: #7FB7BE !important;
  }
  /* Animation for modal fields */
  .payment-fields {
    animation: fadeIn 0.3s ease-in-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}

{% block content %}
<!-- SIDEBAR -->
<div class="d-flex min-vh-100">
  {% include 'sidebar.html' %}

  <!-- content-->
  <!-- MAIN CONTENT -->
  <main class="main-content flex-grow-1 px-3">
    <div class="container">
      <div class="d-flex align-items-start justify-content-between mb-4">
        <div>
          <h2 style="color: #4b2e2b; font-weight: bold;">Payment Methods</h2>
          <p style="color: #8c5a3c; font-size: 14px">
            Manage your saved payment cards, GoPay, and bank accounts
          </p>
        </div>

        <button class="btn background-green text-white rounded-pill px-4" onclick="openAddModal()" style="cursor: pointer; border: none; font-weight: 500;">
          <i class="bi bi-plus-lg me-2"></i>Add Payment Method
        </button>
      </div>

      <!-- Dynamic Payment Methods Container -->
      <div id="payment-methods-container"></div>
    </div>
  </main>
</div> <!-- end of d-flex min-vh-100 -->

<!-- Modal Add/Edit Payment Method -->
<div class="modal fade" id="paymentMethodModal" tabindex="-1" aria-labelledby="paymentMethodModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 15px; border: 2px solid #E9DED2; background-color: #FFF8F0;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fs-5" id="paymentMethodModalLabel" style="color: #4B2E2B; font-weight: bold;">Add Payment Method</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="paymentMethodForm">
          <input type="hidden" id="edit-id" value="">
          
          <!-- Select Payment Type -->
          <label class="form-label d-block mb-2" style="color: #8C5A3C; font-weight: 600; font-size: 13px;">Choose Payment Type</label>
          <div class="payment-type-selector">
            <div class="payment-type-option active" data-type="card" onclick="selectPaymentType('card')">
              <i class="fa-regular fa-credit-card"></i>
              <span>Credit Card</span>
            </div>
            <div class="payment-type-option" data-type="gopay" onclick="selectPaymentType('gopay')">
              <i class="fa-solid fa-wallet"></i>
              <span>GoPay</span>
            </div>
            <div class="payment-type-option" data-type="bank" onclick="selectPaymentType('bank')">
              <i class="fa-solid fa-building-columns"></i>
              <span>Bank Transfer</span>
            </div>
          </div>
          <input type="hidden" id="payment-type" value="card">

          <!-- CREDIT CARD FIELDS -->
          <div id="fields-card" class="payment-fields">
            <div class="mb-3">
              <label for="card-provider" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Card Brand</label>
              <select class="form-select border-brown" id="card-provider" style="background-color: #FFF8F0; border-radius: 8px;">
                <option value="Visa">Visa</option>
                <option value="Mastercard">Mastercard</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="card-number" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Card Number</label>
              <input type="text" class="form-control border-brown" id="card-number" placeholder="4242 4242 4242 4242" maxlength="19" style="background-color: #FFF8F0; border-radius: 8px;" required>
            </div>
            <div class="mb-3">
              <label for="card-holder" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Card Holder Name</label>
              <input type="text" class="form-control border-brown" id="card-holder" placeholder="e.g. Keqing" style="background-color: #FFF8F0; border-radius: 8px;" required>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label for="card-expiry" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Expiry Date</label>
                <input type="text" class="form-control border-brown" id="card-expiry" placeholder="MM/YY" maxlength="5" style="background-color: #FFF8F0; border-radius: 8px;" required>
              </div>
              <div class="col-6 mb-3">
                <label for="card-cvv" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">CVV</label>
                <input type="password" class="form-control border-brown" id="card-cvv" placeholder="•••" maxlength="3" style="background-color: #FFF8F0; border-radius: 8px;" required>
              </div>
            </div>
          </div>

          <!-- GOPAY FIELDS -->
          <div id="fields-gopay" class="payment-fields d-none">
            <div class="mb-3">
              <label for="gopay-number" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">GoPay Phone Number</label>
              <input type="tel" class="form-control border-brown" id="gopay-number" placeholder="08xxxxxxxxxx" maxlength="13" style="background-color: #FFF8F0; border-radius: 8px;">
            </div>
            <div class="mb-3">
              <label for="gopay-holder" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Account Owner Name</label>
              <input type="text" class="form-control border-brown" id="gopay-holder" placeholder="e.g. Keqing" style="background-color: #FFF8F0; border-radius: 8px;">
            </div>
          </div>

          <!-- BANK TRANSFER FIELDS -->
          <div id="fields-bank" class="payment-fields d-none">
            <div class="mb-3">
              <label for="bank-provider" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Select Bank</label>
              <select class="form-select border-brown" id="bank-provider" style="background-color: #FFF8F0; border-radius: 8px;">
                <option value="BCA">BCA</option>
                <option value="Mandiri">Mandiri</option>
                <option value="BNI">BNI</option>
                <option value="BRI">BRI</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="bank-number" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Bank Account Number</label>
              <input type="text" class="form-control border-brown" id="bank-number" placeholder="e.g. 1234567890" maxlength="15" style="background-color: #FFF8F0; border-radius: 8px;">
            </div>
            <div class="mb-3">
              <label for="bank-holder" class="form-label" style="color: #8C5A3C; font-size: 13px; font-weight: 500;">Account Holder Name</label>
              <input type="text" class="form-control border-brown" id="bank-holder" placeholder="e.g. Keqing" style="background-color: #FFF8F0; border-radius: 8px;">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn rounded-pill border-brown background-light-brown text-brown px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn rounded-pill background-green text-white px-4" onclick="savePaymentMethod()">Save Method</button>
      </div>
    </div>
  </div>
</div>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
  crossorigin="anonymous"
></script>

<script>
  let modalInstance = null;

  document.addEventListener('DOMContentLoaded', () => {
    renderPaymentMethods();
    modalInstance = new bootstrap.Modal(document.getElementById('paymentMethodModal'));
    
    // Register formatters
    const expiryInput = document.getElementById('card-expiry');
    expiryInput.addEventListener('input', function(e) {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val.length >= 2) {
        e.target.value = val.slice(0, 2) + '/' + val.slice(2, 4);
      } else {
        e.target.value = val;
      }
    });

    const cardNumInput = document.getElementById('card-number');
    cardNumInput.addEventListener('input', function(e) {
      let val = e.target.value.replace(/[^0-9]/g, '');
      let formatted = '';
      for (let i = 0; i < val.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += ' ';
        formatted += val[i];
      }
      e.target.value = formatted.slice(0, 19);
    });

    const cvvInput = document.getElementById('card-cvv');
    cvvInput.addEventListener('input', function(e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 3);
    });

    const phoneInput = document.getElementById('gopay-number');
    phoneInput.addEventListener('input', function(e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 13);
    });

    const bankAccInput = document.getElementById('bank-number');
    bankAccInput.addEventListener('input', function(e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 15);
    });
  });

  function selectPaymentType(type) {
    document.querySelectorAll('.payment-type-option').forEach(opt => {
      if (opt.getAttribute('data-type') === type) {
        opt.classList.add('active');
      } else {
        opt.classList.remove('active');
      }
    });

    document.getElementById('payment-type').value = type;

    document.querySelectorAll('.payment-fields').forEach(group => {
      group.classList.add('d-none');
    });
    document.getElementById('fields-' + type).classList.remove('d-none');

    toggleRequiredFields(type);
  }

  function toggleRequiredFields(activeType) {
    const cardInputs = ['card-number', 'card-holder', 'card-expiry', 'card-cvv'];
    cardInputs.forEach(id => {
      document.getElementById(id).required = (activeType === 'card');
    });

    const gopayInputs = ['gopay-number', 'gopay-holder'];
    gopayInputs.forEach(id => {
      document.getElementById(id).required = (activeType === 'gopay');
    });

    const bankInputs = ['bank-number', 'bank-holder'];
    bankInputs.forEach(id => {
      document.getElementById(id).required = (activeType === 'bank');
    });
  }

  function openAddModal() {
    document.getElementById('paymentMethodModalLabel').innerText = 'Add Payment Method';
    document.getElementById('edit-id').value = '';
    document.getElementById('paymentMethodForm').reset();
    
    selectPaymentType('card');
    
    document.getElementById('card-holder').value = "{{ user.nama }}";
    document.getElementById('gopay-holder').value = "{{ user.nama }}";
    document.getElementById('bank-holder').value = "{{ user.nama }}";
    document.getElementById('gopay-number').value = "{{ user.no_telepon }}".replace(/[^0-9]/g, '') || "";
    
    modalInstance.show();
  }

  function openEditModal(id) {
    const methods = JSON.parse(localStorage.getItem('payment_methods')) || [];
    const pm = methods.find(item => item.id === id);
    if (!pm) return;

    document.getElementById('paymentMethodModalLabel').innerText = 'Edit Payment Method';
    document.getElementById('edit-id').value = pm.id;
    document.getElementById('payment-type').value = pm.type;
    
    selectPaymentType(pm.type);

    if (pm.type === 'card') {
      document.getElementById('card-provider').value = pm.provider;
      let val = pm.number;
      let formatted = '';
      for (let i = 0; i < val.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += ' ';
        formatted += val[i];
      }
      document.getElementById('card-number').value = formatted;
      document.getElementById('card-holder').value = pm.holder;
      document.getElementById('card-expiry').value = pm.expiry;
      document.getElementById('card-cvv').value = pm.cvv || '';
    } else if (pm.type === 'gopay') {
      document.getElementById('gopay-number').value = pm.number;
      document.getElementById('gopay-holder').value = pm.holder;
    } else if (pm.type === 'bank') {
      document.getElementById('bank-provider').value = pm.provider;
      document.getElementById('bank-number').value = pm.number;
      document.getElementById('bank-holder').value = pm.holder;
    }

    modalInstance.show();
  }

  function savePaymentMethod() {
    const form = document.getElementById('paymentMethodForm');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const editId = document.getElementById('edit-id').value;
    const type = document.getElementById('payment-type').value;
    
    let provider = '';
    let number = '';
    let holder = '';
    let expiry = '';
    let cvv = '';

    if (type === 'card') {
      provider = document.getElementById('card-provider').value;
      number = document.getElementById('card-number').value.replace(/\s/g, '');
      holder = document.getElementById('card-holder').value;
      expiry = document.getElementById('card-expiry').value;
      cvv = document.getElementById('card-cvv').value;
    } else if (type === 'gopay') {
      provider = 'GoPay';
      number = document.getElementById('gopay-number').value;
      holder = document.getElementById('gopay-holder').value;
    } else if (type === 'bank') {
      provider = document.getElementById('bank-provider').value;
      number = document.getElementById('bank-number').value;
      holder = document.getElementById('bank-holder').value;
    }

    let methods = JSON.parse(localStorage.getItem('payment_methods')) || [];

    if (editId) {
      const index = methods.findIndex(item => item.id === editId);
      if (index !== -1) {
        methods[index] = {
          ...methods[index],
          type,
          provider,
          number,
          holder,
          expiry,
          cvv
        };
      }
    } else {
      const newId = 'pm_' + Date.now();
      const newMethod = {
        id: newId,
        type,
        provider,
        number,
        holder,
        expiry,
        cvv,
        isDefault: methods.length === 0
      };
      methods.push(newMethod);
    }

    localStorage.setItem('payment_methods', JSON.stringify(methods));
    modalInstance.hide();
    renderPaymentMethods();
  }

  function setDefaultMethod(id) {
    let methods = JSON.parse(localStorage.getItem('payment_methods')) || [];
    methods = methods.map(item => {
      return {
        ...item,
        isDefault: item.id === id
      };
    });
    localStorage.setItem('payment_methods', JSON.stringify(methods));
    renderPaymentMethods();
  }

  function deletePaymentMethod(id) {
    if (!confirm('Are you sure you want to delete this payment method?')) return;
    
    let methods = JSON.parse(localStorage.getItem('payment_methods')) || [];
    const target = methods.find(item => item.id === id);
    
    methods = methods.filter(item => item.id !== id);
    
    if (target && target.isDefault && methods.length > 0) {
      methods[0].isDefault = true;
    }

    localStorage.setItem('payment_methods', JSON.stringify(methods));
    renderPaymentMethods();
  }

  function renderPaymentMethods() {
    const container = document.getElementById('payment-methods-container');
    if (!container) return;

    let methods = JSON.parse(localStorage.getItem('payment_methods'));
    if (methods === null) {
      methods = [
        {
          id: "pm_1",
          type: "card",
          provider: "Visa",
          number: "4242424242424242",
          holder: "{{ user.nama }}",
          expiry: "12/31",
          cvv: "123",
          isDefault: true
        },
        {
          id: "pm_2",
          type: "card",
          provider: "Mastercard",
          number: "6767676767676767",
          holder: "{{ user.nama }}",
          expiry: "12/31",
          cvv: "123",
          isDefault: false
        },
        {
          id: "pm_3",
          type: "gopay",
          provider: "GoPay",
          number: "{{ user.no_telepon }}".replace(/[^0-9]/g, '') || "081234567890",
          holder: "{{ user.nama }}",
          isDefault: false
        },
        {
          id: "pm_4",
          type: "bank",
          provider: "BCA",
          number: "8220123456",
          holder: "{{ user.nama }}",
          isDefault: false
        }
      ];
      localStorage.setItem('payment_methods', JSON.stringify(methods));
    }

    container.innerHTML = '';

    if (methods.length === 0) {
      container.innerHTML = `
        <div class="text-center py-5 border-brown background-light-brown" style="border-radius: 10px; border: 2px dashed #E9DED2 !important;">
          <i class="bi bi-credit-card-2-front text-muted" style="font-size: 48px; color: #8C5A3C !important; opacity: 0.5;"></i>
          <h5 class="mt-3" style="color: #4B2E2B; font-weight: 600;">No Payment Methods Saved</h5>
          <p class="text-muted mb-4" style="font-size: 13px;">Save your cards, GoPay, or bank accounts for faster checkouts.</p>
          <button class="btn background-green text-white rounded-pill px-4" onclick="openAddModal()" style="border: none; font-weight: 500;">
            <i class="bi bi-plus-lg me-2"></i>Add Payment Method
          </button>
        </div>
      `;
      return;
    }

    methods.forEach(pm => {
      let cardHTML = '';
      let detailsHTML = '';

      let lastFour = pm.number.slice(-4);
      let maskedNum = '';
      if (pm.type === 'card') {
        maskedNum = `•••• •••• •••• ${lastFour}`;
      } else if (pm.type === 'gopay') {
        let prefix = pm.number.substring(0, 4);
        maskedNum = `${prefix}-••••-${lastFour}`;
      } else if (pm.type === 'bank') {
        maskedNum = `•••• •••• ${lastFour}`;
      }

      if (pm.type === 'card') {
        const cardClass = pm.provider.toLowerCase() === 'visa' ? 'card-visa' : 'card-mastercard';
        cardHTML = `
          <div class="${cardClass} squircle d-flex flex-column justify-content-between">
            <div class="d-flex justify-content-between">
              <div class="squircle-card"></div>
              <div class="text-white visa-font">
                <strong>${pm.provider}</strong>
              </div>
            </div>
            <div class="ml-25 mb-3">
              <span class="card-bullet text-white">●●●● ●●●● ●●●● </span>
              <span class="card-number text-white"><strong>${lastFour}</strong></span>
            </div>
            <div class="ml-25 justify-content-between d-flex mb-25 mr-2">
              <div>
                <span style="opacity: 0.8; color: white; font-size: small">Card Holder</span>
                <div class="text-white fs-6"><strong>${pm.holder}</strong></div>
              </div>
              <div>
                <span style="opacity: 0.8; color: white; font-size: small">Expires</span>
                <div class="text-white fs-6" style="opacity: 0.9"><strong>${pm.expiry}</strong></div>
              </div>
            </div>
          </div>
        `;

        detailsHTML = `
          <li class="text-dark-brown mb-2 fs-6">
            <strong>${pm.provider} •••• ${lastFour}</strong>
            ${pm.isDefault ? '<small class="text-white background-green rounded-pill px-2 py-1" style="font-size: 11px; margin-left: 8px;">Default</small>' : ''}
          </li>
          <li class="mb-2" style="font-size: 13px">Expires on ${pm.expiry}</li>
          <li class="mb-2" style="font-size: 13px">${pm.holder}</li>
        `;
      } 
      else if (pm.type === 'gopay') {
        cardHTML = `
          <div class="squircle d-flex flex-column justify-content-between" style="width: 100%; max-width: 480px; aspect-ratio: 480/250; height: auto; border-radius: 20px; background: linear-gradient(135deg, #00AED6, #0082A6); box-shadow: 0 4px 15px rgba(0, 174, 214, 0.2); transition: all 0.3s ease;">
            <div class="d-flex justify-content-between">
              <div class="squircle-card d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-wallet text-white" style="font-size: 20px;"></i>
              </div>
              <div class="text-white visa-font">
                <strong>go-pay</strong>
              </div>
            </div>
            <div class="ml-25 mb-3">
              <span class="card-number text-white"><strong>${maskedNum}</strong></span>
            </div>
            <div class="ml-25 justify-content-between d-flex mb-25 mr-2">
              <div>
                <span style="opacity: 0.8; color: white; font-size: small">Account Holder</span>
                <div class="text-white fs-6"><strong>${pm.holder}</strong></div>
              </div>
              <div>
                <span style="opacity: 0.8; color: white; font-size: small">Type</span>
                <div class="text-white fs-6" style="opacity: 0.9"><strong>E-Wallet</strong></div>
              </div>
            </div>
          </div>
        `;

        detailsHTML = `
          <li class="text-dark-brown mb-2 fs-6">
            <strong>GoPay • ${maskedNum}</strong>
            ${pm.isDefault ? '<small class="text-white background-green rounded-pill px-2 py-1" style="font-size: 11px; margin-left: 8px;">Default</small>' : ''}
          </li>
          <li class="mb-2" style="font-size: 13px">E-Wallet Payment</li>
          <li class="mb-2" style="font-size: 13px">${pm.holder}</li>
        `;
      } 
      else if (pm.type === 'bank') {
        let bgGradient = 'linear-gradient(135deg, #2b3a4a, #1a222d)';
        if (pm.provider === 'BCA') bgGradient = 'linear-gradient(135deg, #0056a3, #003366)';
        else if (pm.provider === 'Mandiri') bgGradient = 'linear-gradient(135deg, #1c3f94, #0d2154)';
        else if (pm.provider === 'BNI') bgGradient = 'linear-gradient(135deg, #ff6600, #b34700)';
        else if (pm.provider === 'BRI') bgGradient = 'linear-gradient(135deg, #00529C, #008AD2)';

        cardHTML = `
          <div class="squircle d-flex flex-column justify-content-between" style="width: 100%; max-width: 480px; aspect-ratio: 480/250; height: auto; border-radius: 20px; background: ${bgGradient}; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); transition: all 0.3s ease;">
            <div class="d-flex justify-content-between">
              <div class="squircle-card d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-building-columns text-white" style="font-size: 20px;"></i>
              </div>
              <div class="text-white visa-font">
                <strong>${pm.provider} Transfer</strong>
              </div>
            </div>
            <div class="ml-25 mb-3">
              <span class="card-bullet text-white">•••• •••• </span>
              <span class="card-number text-white"><strong>${lastFour}</strong></span>
            </div>
            <div class="ml-25 justify-content-between d-flex mb-25 mr-2">
              <div>
                <span style="opacity: 0.8; color: white; font-size: small">Account Holder</span>
                <div class="text-white fs-6"><strong>${pm.holder}</strong></div>
              </div>
              <div>
                <span style="opacity: 0.8; color: white; font-size: small">Type</span>
                <div class="text-white fs-6" style="opacity: 0.9"><strong>Virtual Account</strong></div>
              </div>
            </div>
          </div>
        `;

        detailsHTML = `
          <li class="text-dark-brown mb-2 fs-6">
            <strong>Bank ${pm.provider} • ${maskedNum}</strong>
            ${pm.isDefault ? '<small class="text-white background-green rounded-pill px-2 py-1" style="font-size: 11px; margin-left: 8px;">Default</small>' : ''}
          </li>
          <li class="mb-2" style="font-size: 13px">Bank Transfer Method</li>
          <li class="mb-2" style="font-size: 13px">${pm.holder}</li>
        `;
      }

      const outerCardClass = pm.isDefault ? 'card background-brown-with-green-border py-3 px-3' : 'card border-brown py-3 px-3';
      
      let actionButtonsHTML = '';
      if (pm.isDefault) {
        actionButtonsHTML = `
          <div class="row">
            <div class="col">
              <div class="btn w-100 rounded-pill border-brown background-light-brown text-center py-2" onclick="openEditModal('${pm.id}')" style="cursor: pointer; font-size: 13px; font-weight: 500;">
                <i class="bi bi-pencil-square me-1"></i>
                <span>Edit</span>
              </div>
            </div>
            <div class="col-sm-auto">
              <button class="btn background-red py-2 px-3 text-center" style="border-radius: 1rem;" onclick="deletePaymentMethod('${pm.id}')">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </div>
        `;
      } else {
        actionButtonsHTML = `
          <div class="row">
            <div class="col-sm-5 mb-2 mb-sm-0">
              <div class="btn w-100 rounded-pill border-brown background-brown-with-hover text-center py-2" onclick="openEditModal('${pm.id}')" style="cursor: pointer; font-size: 13px; font-weight: 500;">
                <i class="bi bi-pencil-square me-1"></i>
                <span>Edit</span>
              </div>
            </div>
            <div class="col-sm-5 mb-2 mb-sm-0">
              <div class="btn w-100 rounded-pill button-green font-green text-center py-2" onclick="setDefaultMethod('${pm.id}')" style="cursor: pointer; font-size: 13px; font-weight: 500;">
                <i class="bi bi-star me-1"></i>
                <span>Set default</span>
              </div>
            </div>
            <div class="col-sm-2 text-end">
              <button class="btn background-red py-2 px-3 text-center" style="border-radius: 1rem;" onclick="deletePaymentMethod('${pm.id}')">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </div>
        `;
      }

      const paymentItem = document.createElement('div');
      paymentItem.className = 'pb-4';
      paymentItem.innerHTML = `
        <div class="${outerCardClass}" style="border-radius: 10px">
          <div class="card-body">
            <div class="row align-items-center">
              <div class="col-sm-5 mb-4 mb-sm-0">
                ${cardHTML}
              </div>
              <div class="col-sm-7 d-flex flex-column justify-content-between" style="min-height: 180px;">
                <div>
                  <ul class="list-unstyled text-brown mb-3" style="font-size: small">
                    ${detailsHTML}
                  </ul>
                </div>
                <div>
                  ${actionButtonsHTML}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      container.appendChild(paymentItem);
    });
  }
</script>
{% endblock %}
