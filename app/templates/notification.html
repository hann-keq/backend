<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications - PetCare</title>

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Font Awesome (buat logo paw) -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/dashboard.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/notification.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/profile-picture.css') }}"
    />
  </head>

  <body>
    <div class="dashboard-container">
      <!-- NAVBAR (SAMA PERSIS) -->
      <header class="top-nav">
        <div class="logo-area">
          <i class="fas fa-paw logo-icon"></i>
          <span class="logo-text">PetCare</span>
        </div>

        <nav class="main-nav">
          <a href="{{ url_for('petcaredashboard') }}">
            <i class="bi bi-house"></i>
            <span>Home</span>
          </a>

          <a href="{{ url_for('petshop') }}">
            <i class="bi bi-bag-dash"></i>
            <span>Shop</span>
          </a>

          <a href="{{ url_for('booking') }}">
            <i class="bi bi-calendar"></i>
            <span>Booking</span>
          </a>

          <a href="{{ url_for('profile') }}">
            <i class="bi bi-person"></i>
            <span>Profile</span>
          </a>
        </nav>

        <!-- RIGHT SIDE (BIAR SAMA) -->
        <div class="top-right-actions">
          <a href="{{ url_for('notification') }}" class="notification-icon">
            <i class="bi bi-bell"></i>
            <span class="notification-dot"></span>
          </a>

          <div class="profile-avatar">
            <img class="profile-navbar" src="{{ user.foto or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" alt="" />
          </div>
        </div>
      </header>

      <!-- MAIN (PAKAI main-content) -->
      <main class="main-content">
        <div class="main-column">
          <div class="back-btn" onclick="goBack()">
            <i class="bi bi-arrow-left"></i>
            <span>Back</span>
          </div>
          <h2>Notifications</h2>

          <!-- FILTER -->
          <div class="filter">
            <button class="active" data-filter="all">All</button>
            <button data-filter="reminder">Reminder</button>
            <button data-filter="activity">Activity</button>
            <button data-filter="system">System</button>
          </div>

          <!-- LIST -->
          <div class="notification-list">
            {% for notif in notifications %}
            <div
              class="notif-card{% if notif.is_urgent %} notif-urgent{% endif %}{% if notif.is_unread %} notif-unread{% endif %}"
              data-type="{{ notif.type }}"
            >
              <div class="icon">{{ notif.icon }}</div>
              <div class="content">
                <h4>{{ notif.title }}</h4>
                <p>{{ notif.desc }}</p>
              </div>
              {% if notif.is_urgent %}
              <span class="notif-badge">Urgent</span>
              {% endif %}
            </div>
            {% else %}
            <div class="text-center py-5 text-muted">
              <i class="bi bi-bell-slash fs-2 d-block mb-3"></i>
              No notifications yet.
            </div>
            {% endfor %}
          </div>
        </div>

        <!-- SIDEBAR (OPSIONAL, BIAR SAMA PERSIS) -->
        <aside class="sidebar-column">
          <section class="sidebar-section">
            <h2>Tips</h2>
            <p style="font-size: 14px; color: #777">
              Keep your pet healthy by checking notifications regularly 🐾
            </p>
          </section>
        </aside>
      </main>
    </div>
    <script>
      const buttons = document.querySelectorAll(".filter button");
      const cards = document.querySelectorAll(".notif-card");

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          // reset active
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          const filter = btn.getAttribute("data-filter");

          cards.forEach((card) => {
            const type = card.getAttribute("data-type");

            if (filter === "all" || type === filter) {
              card.style.display = "flex";
            } else {
              card.style.display = "none";
            }
          });
        });
      });

      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "petcaredashboard.html";
        }
      }
    </script>
  </body>
</html>
