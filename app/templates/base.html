<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetCare</title>

    {% block prefetch %} {% endblock %}

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/profile-picture.css') }}"
    />
    {% block style %} {% endblock %}
  </head>
  <body style="background-color: #fff8f0">
    <header class="top-nav">
      <div class="logo-area">
        <i class="fas fa-paw logo-icon"></i>
        <span class="logo-text">PetCare</span>
      </div>
      <nav class="main-nav">
        <a
          href="{{ url_for('petcaredashboard') }}"
          class="{% if request.url.path == '/petcaredashboard' %}active{% endif %}"
          ><i class="bi bi-house"></i><span>Home</span></a
        >
        <a
          href="{{ url_for('petshop') }}"
          class="{% if request.url.path == '/petshop.html' %} active {% endif %}"
          ><i class="bi bi-bag-dash"></i><span>Shop</span></a
        >
        <a
          href="{{ url_for('booking') }}"
          class="{% if request.url.path == '/booking.html' %}active{% endif %}"
          ><i class="bi bi-calendar"></i><span>Booking</span></a
        >
        <a
          href="{{ url_for('profile') }}"
          class="{% if request.url.path == '/profile' %}active{% endif %}"
          ><i class="bi bi-person"></i><span>Profile</span></a
        >
      </nav>
      <div class="top-right-actions">
        <a href="{{ url_for('notification') }}" class="notification-icon">
          <i class="bi bi-bell"></i><span class="notification-dot"></span>
        </a>
        <div class="profile-avatar">
          <img class="profile-navbar" src="{{user.foto}}" alt="" />
        </div>
      </div>
    </header>

    {% block content %} {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      /* Pure-CSS loading overlay — no CDN dependency, works offline */
      .petcare-loader {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(255, 248, 240, 0.85);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }
      .petcare-loader.active {
        display: flex;
      }
      .petcare-loader .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #e6d3c3;
        border-top-color: #8c5a3c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .petcare-loader .text {
        font-size: 14px;
        color: #4b2e2b;
        font-weight: 600;
      }
    </style>

    <div class="petcare-loader" id="petcareLoader">
      <div class="spinner"></div>
      <div class="text">Mohon tunggu...</div>
    </div>

    <script>
      const loader = document.getElementById("petcareLoader");

      function showLoading() {
        loader && loader.classList.add("active");
      }
      function hideLoading() {
        loader && loader.classList.remove("active");
      }

      // Link clicks
      document.addEventListener("click", function (e) {
        const link = e.target.closest("a");
        if (!link) return;
        const href = link.getAttribute("href");
        if (
          !href ||
          href.startsWith("#") ||
          href.startsWith("javascript:") ||
          link.getAttribute("target") === "_blank"
        )
          return;
        if (link.getAttribute("data-no-loader") === "true") return;
        showLoading();
      });

      // Form submits
      document.addEventListener("submit", function () {
        showLoading();
      });

      // Hide on page show (back/forward)
      window.addEventListener("pageshow", function () {
        hideLoading();
      });
    </script>
  </body>
</html>
