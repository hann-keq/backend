{% extends 'base.html' %} {% block prefetch %} {% endblock %} {% block style %}
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', path='css/addpet.css') }}" />
{% endblock %} {% block content %}
<main class="main-content">
  <div class="add-pet-container">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a href="/petcaredashboard" class="btn-back-dashboard">
          <i class="bi bi-arrow-left"></i> Dashboard
        </a>
        <div>
          <h3 class="header-title m-0">Add New Pet</h3>
        </div>
      </div>
    </div>

    <div class="premium-form-card">
      <form action="/pets/add" method="post" enctype="multipart/form-data">
        <h6 class="form-group-title">
          <i class="bi bi-camera"></i> Pet Avatar
        </h6>

        <input
          type="file"
          id="petPhotoInput"
          name="foto_hewan"
          style="display: none"
          accept="image/*"
        />

        <label for="petPhotoInput" class="icon-circle-big" id="uploadLabel">
          <div
            id="previewContainer"
            class="d-flex align-items-center justify-content-center flex-column"
          >
            <div><i class="bi bi-cloud-upload icon-size"></i></div>
            <span
              style="
                font-size: 11px;
                font-weight: 600;
                color: #8c5a3c;
                margin-top: 4px;
              "
              >Upload Photo</span
            >
          </div>
        </label>

        <h6 class="form-group-title">
          <i class="bi bi-file-earmark-person"></i> Biological Information
        </h6>

        <div class="mb-4">
          <label class="form-label-custom">Pet Name *</label>
          <div class="input-field-wrapper">
            <i class="bi bi-pencil field-icon"></i>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. Max, Luna, Buddy"
              name="pet_name"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="col-sm-6 mb-4">
            <label class="form-label-custom">Species *</label>
            <div class="input-field-wrapper">
              <i class="bi bi-search field-icon"></i>
              <select
                name="jenis_hewan"
                class="form-select form-control"
                required
              >
                <option value="Anjing">Anjing</option>
                <option value="Kucing">Kucing</option>
              </select>
            </div>
          </div>

          <div class="col-sm-6 mb-4">
            <label class="form-label-custom">Breed / Ras *</label>
            <div class="input-field-wrapper">
              <i class="bi bi-type field-icon"></i>
              <input
                type="text"
                name="ras_hewan"
                class="form-control"
                placeholder="e.g. Persia, Shiba Inu, Local"
                required
              />
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-4 mb-4">
            <label class="form-label-custom">Age</label>
            <div class="input-field-wrapper">
              <i class="bi bi-calendar3 field-icon"></i>
              <input
                type="text"
                class="form-control"
                placeholder="e.g. 3 years"
                name="umur"
              />
            </div>
          </div>

          <div class="col-sm-4 mb-4">
            <label class="form-label-custom">Weight</label>
            <div class="input-field-wrapper">
              <i class="bi bi-box-seam field-icon"></i>
              <input
                type="text"
                class="form-control"
                placeholder="e.g. 5 kg"
                name="berat"
              />
            </div>
          </div>

          <div class="col-sm-4 mb-4">
            <label for="Select" class="form-label-custom">Gender *</label>
            <div class="input-field-wrapper">
              <i class="bi bi-gender-male field-icon"></i>
              <select
                id="Select"
                name="gender"
                class="form-select form-control"
                required
              >
                <option value="Jantan">Jantan</option>
                <option value="Betina">Betina</option>
              </select>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label-custom">Fur Color / Pattern</label>
          <div class="input-field-wrapper">
            <i class="bi bi-palette field-icon"></i>
            <input
              type="text"
              name="warna"
              class="form-control"
              placeholder="e.g. Orange Tabby, Calico"
            />
          </div>
        </div>

        <div class="d-flex justify-content-end gap-3 actions-row">
          <a href="/pets" class="btn-premium-cancel"> Cancel </a>
          <button type="submit" class="btn btn-premium-save">
            <i class="bi bi-plus-circle me-2"></i> Add Pet
          </button>
        </div>
      </form>
    </div>
  </div>
</main>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
  crossorigin="anonymous"
></script>

<script>
  // Script untuk menangani preview gambar peliharaan secara realtime
  document
    .getElementById("petPhotoInput")
    .addEventListener("change", function (event) {
      const [file] = event.target.files;
      if (file) {
        const previewContainer = document.getElementById("previewContainer");
        const uploadLabel = document.getElementById("uploadLabel");

        uploadLabel.style.borderStyle = "solid";

        previewContainer.innerHTML = `
        <img src="${URL.createObjectURL(file)}"
             style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; object-fit: cover;"
             alt="Pet Preview" />
      `;
      }
    });
</script>
{% endblock %}
