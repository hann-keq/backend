version: "3.8"

services:
  db:
    image: mariadb:lts-ubi9
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  php:
    image: php:8.2.30-apache
    container_name: php-app
    restart: always
    ports:
      - "8081:80"
    volumes:
      - /home/keq/docker/portainer/html:/var/www/html
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - db

  # Servis User (Membaca/Menampilkan Gambar)
  fastapi-app:
    build:
      context: .
    container_name: fastapi_main_app
    restart: always
    ports:
      - "8001:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      # Shared volume for uploaded files (admin writes, user reads)
      - uploaded_files:/app/app/static/uploads

  # Servis Admin (Mengunggah Gambar)
  fastapi-admin:
    build:
      context: .
    container_name: fastapi_admin_app
    restart: always
    ports:
      - "8002:8002"
    command: uvicorn app.admin_app:admin_app --host 0.0.0.0 --port 8002
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - uploaded_files:/app/app/static/uploads

# Definisikan volume baru di bawah sini
volumes:
  db_data:
  uploaded_files:
